[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="examples/*"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=0
vram_texture_compression/for_desktop=true
; MUST stay false. Godot's EditorExportPlatformWeb::has_valid_project_configuration
; fails the export when for_mobile is true and should_import_etc2_astc() is false
; (the case on our x86_64 Linux workers, which prefer S3TC/BPTC) — and it returns
; that failure with an EMPTY error string, so the export dies as a bare
; "configuration errors:" with no detail and ships a black screen.
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
; 2 = Adaptive (canvas fills the browser). 1 = Project (lock to
; viewport_width x viewport_height — 16:9 letterboxes in the portrait
; vote iframe). 0 = None. Godot's HTML shell defaults to 2; do not set 1.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
